name: dotnet test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore test/Tests.Fx.Net/Tests.Fx.Net.csproj

      - name: Build Test Project
        run: dotnet build test/Tests.Fx.Net/Tests.Fx.Net.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test test/Tests.Fx.Net/Tests.Fx.Net.csproj --configuration Release --no-build --report-xunit-trx

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: xUnit 3 Tests Report
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'