  summary: >-
    Обеспечивает представление типа <xref href="System.Void" data-throw-if-not-resolved="false"></xref> в сценариях, 

    где использование встроенного ключевого слова <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/void">void</a> синтаксически невозможно.
  remarks: >-
    Структура имеет минимально допустимый размер (1 байт, принудительно заданный через <xref href="System.Runtime.InteropServices.StructLayoutAttribute" data-throw-if-not-resolved="false"></xref>).

    За счет применения <xref href="System.Runtime.CompilerServices.SkipLocalsInitAttribute" data-throw-if-not-resolved="false"></xref> и передачи по readonly-ссылке минимизируются 

    накладные расходы на стек и полностью исключаются аллокации в управляемой куче

    при работе с высоконагруженными асинхронными конечными автоматами.
